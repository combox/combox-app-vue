map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/combox/mtls/server.crt;
  ssl_certificate_key /etc/combox/mtls/server.key;

  ssl_client_certificate /etc/combox/mtls/ca.crt;
  ssl_verify_client optional;

  ssl_protocols TLSv1.2 TLSv1.3;

  # Crawlable statics must be served (proxied) as-is with a cacheable
  # content type BEFORE the SPA fallback in preview.js can turn them into
  # index.html. Exact file match wins over `location /` by nginx rules; the
  # preview server itself also serves exact files before falling back.
  location = /robots.txt {
    set $app_upstream http://combox-app-vue:4173;
    proxy_pass $app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /llms.txt {
    set $app_upstream http://combox-app-vue:4173;
    proxy_pass $app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /ai-catalog.json {
    set $app_upstream http://combox-app-vue:4173;
    proxy_pass $app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location = /manifest.webmanifest {
    set $app_upstream http://combox-app-vue:4173;
    proxy_pass $app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Cache-Control "public, max-age=3600" always;
  }

  location / {
    set $app_upstream http://combox-app-vue:4173;
    proxy_pass $app_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
